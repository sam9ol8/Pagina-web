
<!-- HEADER: GAME STORE -->
<header class="gs-header">
    <div class="gs-header__inner">

        <!-- LOGO -->
        <a href="index.html" class="gs-logo" aria-label="GAME STORE, inicio">
            <span class="gs-logo__icon">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M6.5 8h11a4.5 4.5 0 0 1 4.2 6.1l-1 2.5a2.5 2.5 0 0 1-4.1.9L14.5 15h-5l-2.1 2.5a2.5 2.5 0 0 1-4.1-.9l-1-2.5A4.5 4.5 0 0 1 6.5 8Z"/>
                    <path d="M7 10.5v4M5 12.5h4"/>
                    <circle cx="16.5" cy="11.5" r=".8" fill="currentColor"/>
                    <circle cx="18.5" cy="13.5" r=".8" fill="currentColor"/>
                </svg>
            </span>

            <span class="gs-logo__text">
                <strong>GAME</strong>
                <span>STORE</span>
            </span>
        </a>

        <!-- NAVEGACIÓN -->
        <nav class="gs-nav" aria-label="Navegación principal">
            <a href="#catalogo" class="gs-nav__link gs-nav__link--active">
                Catálogo
            </a>

            <a href="#ofertas" class="gs-nav__link">
                Ofertas
            </a>

            <a href="#preventas" class="gs-nav__link">
                Preventas
            </a>

            <a href="#novedades" class="gs-nav__link">
                Novedades
            </a>
        </nav>

        <!-- BUSCADOR -->
        <form class="gs-search" action="#catalogo" method="get" role="search">
            <label class="gs-search__icon" for="gs-search-input">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m16 16 4 4"/>
                </svg>
            </label>

            <input
                id="gs-search-input"
                class="gs-search__input"
                type="search"
                name="q"
                placeholder="Buscar videojuegos..."
                autocomplete="off"
            >

            <button class="gs-search__submit" type="submit"
                    aria-label="Buscar">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true">
                    <path d="m9 18 6-6-6-6"/>
                </svg>
            </button>
        </form>

        <!-- ACCIONES -->
        <div class="gs-actions">

            <a href="#favoritos" class="gs-action"
               aria-label="Mis favoritos" title="Favoritos">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
                </svg>
            </a>

            <a href="#cuenta" class="gs-action"
               aria-label="Mi cuenta" title="Mi cuenta">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5 20a7 7 0 0 1 14 0"/>
                </svg>
            </a>

            <a href="#" class="gs-action gs-action--cart"
               aria-label="Carrito de compras" title="Carrito">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M3 3h2l2.4 12.1a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"/>
                    <circle cx="10" cy="20" r="1"/>
                    <circle cx="18" cy="20" r="1"/>
                </svg>

                <span class="gs-cart-count" aria-label="0 productos">
                    0
                </span>
            </a>

        </div>
    </div>
</header>
