<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mi página web</title>
	<link rel="stylesheet" href="css/global.css">
	<link rel="stylesheet" href="css/header.css">
	<link rel="stylesheet" href="css/body.css">
	<link rel="stylesheet" href="css/footer.css">
</head>
<body>
	<div id="site-header"></div>
	<main id="site-body"></main>
	<script>
		["header", "body"].forEach(component => {
			fetch(`components/${component}.html`)
				.then(response => response.text())
				.then(html => {
					const container = document.getElementById(`site-${component}`);
					container.innerHTML = html;
					container.querySelectorAll("script").forEach(inactiveScript => {
						const activeScript = document.createElement("script");
						activeScript.textContent = inactiveScript.textContent;
						inactiveScript.replaceWith(activeScript);
					});
				});
		});
	</script>
</body>
</html>
